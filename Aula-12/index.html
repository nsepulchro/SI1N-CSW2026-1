<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula-12</title>
    <style>
        body {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            background-color: white;
            margin: 0;
            padding: 20px;
        }
        h1 {
           text-align: center; 
           color: darkblue;
        }
        .caixa1 {
            background-color: white;
            padding: 25px;
            margin-bottom: 30px;
            border: 3px solid ;
        }

        a {
            display: block;
            width: fit-content;
           

            
        }

        a::before {
            content:"*";
            color: yellow;
        }
        a::after {
            content: "\266B";
        }

        a:hover {
            background-color: blue;
            color: black;
        }
    </style>
</head>
<body>
    <h1>Aula-12</h1>
    <div class="caixa1">
        <a class= "spotify" href="https://open.spotify.com/intl-pt" target="_blank">Spotify</a>
        <br>
        <a class= "youtube" href="https://www.youtube.com/">Youtube</a>
        <br>
        <a class= "amazon" href="https://music.amazon.com.br/">Amazon</a>
    </div>
    
</body>
</html>
